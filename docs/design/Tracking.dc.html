<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A47}a:hover{color:#086138}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15171A; display: flex; flex-direction: column">

  <div style="background: #0B7A47; color: #FFFFFF; padding: 16px 20px 24px 20px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; font-weight: 600; color: #CFEBDB">Order SD-4821 · Mama Tolu's Kitchen</span>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.1; font-weight: 800">Your rider is on the way</h1>
    <span style="font-size: 15px; color: #E3F3EA">Arriving in about 10 minutes</span>
  </div>

  <div style="margin: -12px 16px 0 16px; background: #FFFFFF; border: 1px solid #E6E8EB; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 700">Delivery PIN</span>
      <span style="font-size: 12px; line-height: 1.4; color: #5B6168; max-width: 170px">Tell the rider only when the food is in your hand</span>
    </span>
    <span style="display: flex; gap: 6px">
      <span style="width: 34px; height: 44px; border-radius: 10px; background: #F3F4F2; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">4</span>
      <span style="width: 34px; height: 44px; border-radius: 10px; background: #F3F4F2; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">7</span>
      <span style="width: 34px; height: 44px; border-radius: 10px; background: #F3F4F2; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">2</span>
      <span style="width: 34px; height: 44px; border-radius: 10px; background: #F3F4F2; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">1</span>
    </span>
  </div>

  <div style="margin: 14px 16px 0 16px; border-radius: 16px; background: #F6F7F5; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
    <span style="width: 44px; height: 44px; border-radius: 22px; background: #15171A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">TA</span>
    <span style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 700">Tunde A.</span>
      <span style="font-size: 13px; color: #5B6168">Your rider</span>
    </span>
    <a href="#" aria-label="Call rider" style="width: 44px; height: 44px; border-radius: 22px; background: #0B7A47; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
    </a>
  </div>

  <ol aria-label="Order progress" style="list-style: none; margin: 20px 0 0 0; padding: 0 20px; display: flex; flex-direction: column">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <li style="display: flex; gap: 14px; min-height: 60px">
        <span style="display: flex; flex-direction: column; align-items: center; width: 24px; flex: none">
          <sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: #0B7A47; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </span>
          </sc-if>
          <sc-if value="{{s.current}}" hint-placeholder-val="{{ false }}">
            <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 7px solid #0B7A47; background: #FFFFFF"></span>
          </sc-if>
          <sc-if value="{{s.todo}}" hint-placeholder-val="{{ false }}">
            <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 2px solid #C3C8CD"></span>
          </sc-if>
          <sc-if value="{{s.line}}" hint-placeholder-val="{{ true }}">
            <span style="flex: 1; width: 2px; background: {{s.lineColor}}"></span>
          </sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; padding-top: 2px; padding-bottom: 14px">
          <span style="font-size: 15px; font-weight: {{s.weight}}; color: {{s.color}}">{{s.label}}</span>
          <span style="font-size: 13px; color: #5B6168">{{s.time}}</span>
        </span>
      </li>
    </sc-for>
  </ol>

  <div style="margin-top: auto; padding: 16px 20px 24px 20px; border-top: 1px solid #E6E8EB; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 14px; color: #5B6168">Problem with this order?</span>
    <a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">Call support</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { label: 'Payment confirmed', time: '7:42 pm', state: 'done' },
      { label: 'Kitchen accepted', time: '7:43 pm · ready in about 20 min', state: 'done' },
      { label: 'Food packed and ready', time: '8:02 pm', state: 'done' },
      { label: 'Picked up by rider', time: '8:05 pm', state: 'current' },
      { label: 'Delivered', time: 'Rider enters your PIN', state: 'todo' }
    ];
    const steps = raw.map((s, i) => ({
      label: s.label,
      time: s.time,
      done: s.state === 'done',
      current: s.state === 'current',
      todo: s.state === 'todo',
      line: i < raw.length - 1,
      lineColor: s.state === 'done' ? '#0B7A47' : '#E1E4E7',
      weight: s.state === 'todo' ? 500 : 700,
      color: s.state === 'todo' ? '#5B6168' : '#15171A'
    }));
    return { steps };
  }
}
</script>
</body>
</html>
