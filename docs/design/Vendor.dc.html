<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vendor page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A47}a:hover{color:#086138}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15171A; display: flex; flex-direction: column">

  <div style="position: relative; height: 196px; flex: none; background: #EDE6DA; display: flex; align-items: center; justify-content: center">
    <span style="font-size: 12px; color: #6B5E4B">Cover photo · the vendor's best-selling plate</span>
    <a href="Main.dc.html" aria-label="Back to home" style="position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15171A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </div>

  <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.3px">Mama Tolu's Kitchen</h1>
      <svg width="20" height="20" viewBox="0 0 24 24" role="img" aria-label="Verified"><circle cx="12" cy="12" r="10" fill="#0B7A47"></circle><path d="M8 12.5l2.6 2.5L16 9.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <span style="font-size: 14px; color: #5B6168">Amala, ewedu, rice · Verified kitchen, Oct 2026</span>
    <div style="display: flex; gap: 8px; margin-top: 4px">
      <span style="display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 10px; background: #F3F4F2; font-size: 13px; font-weight: 600">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="#F5A524"></path></svg>4.7 <span style="font-weight: 400; color: #5B6168">(36)</span>
      </span>
      <span style="display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 10px; background: #F3F4F2; font-size: 13px; font-weight: 600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6168" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>20–30 min
      </span>
      <span style="display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 10px; background: #E7F4EC; color: #0A4F30; font-size: 13px; font-weight: 600">Open till 10pm</span>
    </div>
  </div>

  <div role="tablist" aria-label="Menu categories" style="display: flex; gap: 22px; padding: 0 20px; margin-top: 18px; border-bottom: 1px solid #E6E8EB">
    <button type="button" role="tab" aria-selected="true" style="height: 44px; padding: 0; border: 0; border-bottom: 3px solid #0B7A47; background: none; font: inherit; font-size: 15px; font-weight: 700; color: #15171A">Rice</button>
    <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; font-size: 15px; font-weight: 500; color: #5B6168">Swallow</button>
    <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; font-size: 15px; font-weight: 500; color: #5B6168">Proteins</button>
    <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; font-size: 15px; font-weight: 500; color: #5B6168">Drinks</button>
  </div>

  <div style="padding: 4px 20px 0 20px; display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <sc-if value="{{it.available}}" hint-placeholder-val="{{ true }}">
        <a href="Item.dc.html" style="display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid #EEF0F2; text-decoration: none; color: #15171A">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 16px; font-weight: 700">{{it.name}}</span>
            <span style="font-size: 13px; line-height: 1.4; color: #5B6168">{{it.desc}}</span>
            <span style="font-size: 15px; font-weight: 700; margin-top: 4px">{{it.price}}</span>
          </div>
          <div style="position: relative; width: 96px; height: 96px; flex: none; border-radius: 14px; background: #EDE6DA; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box">
            <span style="font-size: 11px; color: #6B5E4B; text-align: center">Photo</span>
            <span aria-hidden="true" style="position: absolute; right: -6px; bottom: -6px; width: 34px; height: 34px; border-radius: 17px; background: #0B7A47; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </span>
          </div>
        </a>
      </sc-if>
      <sc-if value="{{it.soldOut}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid #EEF0F2; color: #8A9097">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 16px; font-weight: 700; color: #6B7178">{{it.name}}</span>
            <span style="font-size: 13px; line-height: 1.4; color: #6B7178">{{it.desc}}</span>
            <span style="align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: #F3F4F2; color: #3D4248">Sold out today</span>
          </div>
          <div style="width: 96px; height: 96px; flex: none; border-radius: 14px; background: #F3F4F2; display: flex; align-items: center; justify-content: center">
            <span style="font-size: 11px; color: #6B7178">Photo</span>
          </div>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <a href="Checkout.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 58px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; background: #0B7A47; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700">
      <span style="min-width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; color: #0B7A47; font-size: 13px; display: flex; align-items: center; justify-content: center">2</span>View cart
    </span>
    <span style="font-size: 16px; font-weight: 700">₦7,000</span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { name: 'Jollof rice + chicken', desc: 'Smoky party jollof, fried plantain, one piece of chicken', price: '₦3,500', available: true },
      { name: 'Fried rice + turkey', desc: 'With mixed veg, coleslaw and a turkey wing', price: '₦4,500', available: true },
      { name: 'White rice + ayamase', desc: 'Designer stew with assorted meat and boiled egg', price: '₦3,800', available: false },
      { name: 'Ofada rice + sauce', desc: 'Local rice, ofada sauce, ponmo and beef', price: '₦4,000', available: true }
    ];
    return { items: items.map(i => ({ ...i, soldOut: !i.available })) };
  }
}
</script>
</body>
</html>
