<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A47}a:hover{color:#086138}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5E6166; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #15171A">

  <div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 10px">
      <span style="width: 40px; height: 4px; border-radius: 2px; background: #D5D8DC"></span>
    </div>
    <a href="Vendor.dc.html" aria-label="Close" style="position: absolute; right: 16px; top: 14px; width: 40px; height: 40px; border-radius: 20px; background: #F3F4F2; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15171A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>

    <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 150px; border-radius: 16px; background: #EDE6DA; display: flex; align-items: center; justify-content: center">
        <span style="font-size: 12px; color: #6B5E4B">Photo · jollof rice with chicken and plantain</span>
      </div>
      <h1 style="margin: 12px 0 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">Jollof rice + chicken</h1>
      <span style="font-size: 14px; line-height: 1.4; color: #5B6168">Smoky party jollof, fried plantain, one piece of chicken</span>
      <span style="font-size: 16px; font-weight: 700">From ₦3,500</span>
    </div>

    <section style="padding: 18px 20px 0 20px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Choose your protein</h2>
        <span style="font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: #FDF0E1; color: #8A4B08">Required · pick 1</span>
      </div>
      <div role="radiogroup" aria-label="Protein" style="display: flex; flex-direction: column; margin-top: 6px">
        <sc-for list="{{proteins}}" as="p" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0; border: 0; border-bottom: 1px solid #EEF0F2; background: none; font: inherit; color: #15171A; text-align: left; cursor: pointer">
            <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: {{p.ring}}; flex: none"></span>
            <span style="flex: 1; font-size: 15px">{{p.name}}</span>
            <span style="font-size: 14px; color: #5B6168">{{p.delta}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="padding: 16px 20px 0 20px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Extras</h2>
        <span style="font-size: 12px; font-weight: 600; color: #5B6168">Optional</span>
      </div>
      <div style="display: flex; flex-direction: column; margin-top: 6px">
        <sc-for list="{{extras}}" as="e" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EEF0F2">
            <span style="flex: 1; display: flex; flex-direction: column">
              <span style="font-size: 15px">{{e.name}}</span>
              <span style="font-size: 13px; color: #5B6168">{{e.delta}}</span>
            </span>
            <button type="button" aria-label="Remove one" onClick="{{e.dec}}" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #E6E8EB; background: #FFFFFF; font: inherit; font-size: 18px; color: #15171A; cursor: pointer">−</button>
            <span style="width: 18px; text-align: center; font-size: 15px; font-weight: 700">{{e.count}}</span>
            <button type="button" aria-label="Add one" onClick="{{e.inc}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #E7F4EC; font: inherit; font-size: 18px; color: #0B7A47; cursor: pointer">+</button>
          </div>
        </sc-for>
      </div>
    </section>

    <div style="margin-top: auto; padding: 14px 16px 20px 16px; border-top: 1px solid #E6E8EB; display: flex; gap: 12px; align-items: center">
      <div style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px; border-radius: 16px; background: #F3F4F2">
        <button type="button" aria-label="Decrease quantity" onClick="{{qtyDec}}" style="width: 40px; height: 44px; border: 0; background: none; font: inherit; font-size: 20px; color: #15171A; cursor: pointer">−</button>
        <span style="width: 20px; text-align: center; font-size: 16px; font-weight: 700">{{qty}}</span>
        <button type="button" aria-label="Increase quantity" onClick="{{qtyInc}}" style="width: 40px; height: 44px; border: 0; background: none; font: inherit; font-size: 20px; color: #15171A; cursor: pointer">+</button>
      </div>
      <a href="Vendor.dc.html" style="flex: 1; height: 56px; border-radius: 16px; background: #0B7A47; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700">Add to cart · {{total}}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { protein: 'chicken', extras: { plantain: 1, egg: 0, coleslaw: 0 }, qty: 1 };
  }
  renderVals() {
    const naira = n => '₦' + n.toLocaleString('en-NG');
    const base = 3500;
    const proteinList = [
      { id: 'chicken', name: 'Chicken', price: 0 },
      { id: 'turkey', name: 'Turkey', price: 1000 },
      { id: 'fish', name: 'Fried fish', price: 800 }
    ];
    const extraList = [
      { id: 'plantain', name: 'Extra plantain', price: 300 },
      { id: 'egg', name: 'Boiled egg', price: 250 },
      { id: 'coleslaw', name: 'Coleslaw', price: 300 }
    ];
    const s = this.state;
    const proteins = proteinList.map(p => {
      const on = s.protein === p.id;
      return {
        name: p.name,
        delta: p.price ? '+' + naira(p.price) : 'Included',
        checked: on ? 'true' : 'false',
        ring: on ? '7px solid #0B7A47' : '2px solid #C3C8CD',
        pick: () => this.setState({ protein: p.id })
      };
    });
    const setExtra = (id, n) => this.setState({ extras: { ...s.extras, [id]: Math.max(0, Math.min(5, n)) } });
    const extras = extraList.map(e => ({
      name: e.name,
      delta: '+' + naira(e.price) + ' each',
      count: s.extras[e.id],
      inc: () => setExtra(e.id, s.extras[e.id] + 1),
      dec: () => setExtra(e.id, s.extras[e.id] - 1)
    }));
    const proteinPrice = proteinList.find(p => p.id === s.protein).price;
    const extrasPrice = extraList.reduce((sum, e) => sum + e.price * s.extras[e.id], 0);
    const total = (base + proteinPrice + extrasPrice) * s.qty;
    return {
      proteins,
      extras,
      qty: s.qty,
      total: naira(total),
      qtyInc: () => this.setState({ qty: Math.min(10, s.qty + 1) }),
      qtyDec: () => this.setState({ qty: Math.max(1, s.qty - 1) })
    };
  }
}
</script>
</body>
</html>
